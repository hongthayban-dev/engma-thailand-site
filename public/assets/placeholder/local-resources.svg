  <g font-family="Noto Sans Thai, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="800" y="470" font-size="34" letter-spacing="8" fill="#d8ef38">ภาพชั่วคราว · PLACEHOLDER</text>
