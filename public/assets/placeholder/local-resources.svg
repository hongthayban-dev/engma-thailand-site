      <stop offset="0" stop-color="#0e2a3d"/>
      <stop offset="1" stop-color="#06688e"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
